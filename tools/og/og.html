<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#06101f}
.wrap{position:relative;width:1200px;height:630px;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;
  background:radial-gradient(1400px 900px at 78% 62%,#1b3f8a 0%,#0c224f 38%,#06101f 72%,#03080f 100%)}
.streak{position:absolute;left:-200px;height:3px;width:1700px;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 100%);transform:rotate(-7deg);opacity:.45;filter:blur(.6px)}
.glow{position:absolute;right:-120px;bottom:-240px;width:900px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,68,40,.42),rgba(255,68,40,0));filter:blur(12px)}
.track{position:absolute;left:560px;top:-40px;width:720px;height:720px;opacity:.09;filter:invert(0) brightness(3)}
.car{position:absolute;left:380px;top:95px;width:900px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.75))}
.title{position:absolute;left:64px;top:62px;line-height:.86;font-weight:900;letter-spacing:-.035em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.t1{font-size:92px;display:block}
.t2{font-size:92px;display:block}
.t3{font-size:150px;display:inline-block;color:#ffcc33;line-height:.8;margin-top:6px;letter-spacing:-.05em}
.rev{position:absolute;left:64px;top:456px;display:inline-block;background:#e8321e;color:#fff;font-weight:900;font-size:44px;letter-spacing:.14em;text-transform:uppercase;padding:10px 26px 8px;border-radius:8px;transform:skewX(-8deg);box-shadow:0 10px 30px rgba(232,50,30,.35)}
.rev span{display:inline-block;transform:skewX(8deg)}
.sub{position:absolute;left:66px;bottom:38px;font-size:22px;font-weight:600;color:rgba(255,255,255,.78);letter-spacing:.02em}
.sub b{color:#fff}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#e8321e 0 34%,#ffcc33 34% 50%,#fff 50% 100%)}
</style></head><body><div class="wrap">
  <div class="streak" style="top:120px"></div><div class="streak" style="top:210px;opacity:.25"></div><div class="streak" style="top:330px;opacity:.3"></div><div class="streak" style="top:470px;opacity:.2"></div>
  <div class="glow"></div>
  <img class="track" src="/minimaps/0.png">
  <img class="car" src="/og/hero.png">
  <div class="title"><span class="t1">Racing</span><span class="t2">Simulation</span><span class="t3">3</span></div>
  <div class="rev"><span>Revival</span></div>
  <div class="sub">Play it in your browser, phone or desktop &nbsp;·&nbsp; <b>rs3-revival.vercel.app</b></div>
  <div class="bar"></div>
</div></body></html>
